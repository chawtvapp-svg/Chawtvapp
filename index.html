<style>

/* ===== install gate + protection ===== */
html.gated body>*:not(#gate){display:none!important}
html.gated,html.gated body{overflow:hidden;height:100%}
#gate{display:none}
html.gated #gate{display:flex}
#gate{position:fixed;inset:0;z-index:99999;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 80% 0,#2a1d4d 0,transparent 55%),radial-gradient(circle at 0 100%,#3a1636 0,transparent 50%),#080A12}
#gate .gc{width:100%;max-width:420px;border-radius:38px;padding:30px 22px 22px;text-align:center;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 30px 80px rgba(0,0,0,.55)}
#gate .lock{width:86px;height:86px;margin:6px auto 22px;display:block;filter:drop-shadow(0 10px 24px rgba(139,92,246,.45))}
#gate .gt{font-size:19px;line-height:2.1;font-weight:700;color:#fff}
#gate .gt b{color:#8b5cf6}
#gate .gt .hl{display:block;color:#8b5cf6;direction:ltr;font-weight:800}
#gate .gmain{margin-top:22px;width:100%;border:0;border-radius:22px;padding:19px;font:inherit;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(135deg,#8b5cf6,#6d35e0);box-shadow:0 12px 34px rgba(139,92,246,.45)}
#gate .gor{display:flex;align-items:center;gap:12px;margin:16px 6px;color:#8a90a6;font-size:14px}
#gate .gor:before,#gate .gor:after{content:"";flex:1;height:1px;background:rgba(255,255,255,.14)}
#gate .gst{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#gate .gs{display:flex;align-items:center;gap:10px;padding:10px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#fff;text-align:left;direction:ltr;font:inherit}
#gate .gs i{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-style:normal;font-size:22px}
#gate .gs small{display:block;font-size:9px;letter-spacing:1.5px;color:#9aa0b5;font-weight:700}
#gate .gs span{display:block;font-size:16px;font-weight:800;line-height:1.15}
#gate .gnote{margin-top:16px;font-size:12.5px;color:#777d93}
#gst{position:fixed;inset:0;z-index:100000;display:none;align-items:flex-end;background:rgba(0,0,0,.6)}
#gst.on{display:flex}
#gst .sh{width:100%;border-radius:28px 28px 0 0;padding:24px 22px calc(28px + env(safe-area-inset-bottom,0px));background:#16182a;border-top:1px solid rgba(255,255,255,.14);color:#fff}
#gst ol{margin:14px 0 18px;padding-inline-start:22px;line-height:2.3;font-size:16px}
#gst button{width:100%;border:0;border-radius:16px;padding:14px;font:inherit;font-weight:800;color:#fff;background:#8b5cf6}
/* protection: no select / callout / drag (inputs excepted) */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
img,video{-webkit-user-drag:none;user-drag:none;-webkit-touch-callout:none}
.vp{position:relative}
#lt{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:100001;max-width:86%;padding:13px 18px;border-radius:16px;background:rgba(30,30,40,.95);border:1px solid rgba(255,255,255,.16);color:#fff;font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:.3s}
#lt.on{opacity:1;transform:translate(-50%,0)}
html.blurred body>*:not(#gate){filter:blur(28px)}

/* ==== Splash Screen ==== */
#splash{position:fixed;inset:0;z-index:999999;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .6s ease, visibility .6s ease;}
#splash.hide{opacity:0;visibility:hidden;}
#splash .crescent{width:80px;height:80px;background:#fff;border-radius:50%;position:relative;overflow:hidden;box-shadow:0 0 40px rgba(255,255,255,.2);animation:pulse 1.5s infinite ease-in-out;}
#splash .crescent::after{content:"";position:absolute;top:-10px;left:-10px;width:100%;height:100%;background:var(--bg);border-radius:50%;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(0.95);opacity:0.8}}

/* ==== Profile left placement ==== */
#prof .pcover{text-align:left;padding-left:20px}
#prof .pcover .av{margin:10px 0;}
#prof .pcover p{text-align:left;}
#prof .pcover .stats{text-align:left;}
